# This is the main configuration file for Spigot.
# As you can see, there's tons to configure. Some options may impact gameplay, so use
# with caution, and make sure you know what each option does before configuring.
# For a reference for any variable inside this file, check out the Spigot wiki at
# http://www.spigotmc.org/wiki/spigot-configuration/
# 
# If you need help with the configuration or have any questions related to Spigot,
# join us at the IRC or drop by our forums and leave a post.
# 
# IRC: #spigot @ irc.spi.gt ( http://www.spigotmc.org/pages/irc/ )
# Forums: http://www.spigotmc.org/

config-version: 8
settings:
  debug: false
  late-bind: false
  netty-threads: 8
  bungeecord: false
  sample-count: 12
  int-cache-limit: 1024
  attribute:
    maxHealth:
      max: 2048.0
    movementSpeed:
      max: 2048.0
    attackDamage:
      max: 2048.0
  user-cache-size: 500
  player-shuffle: 0
  timeout-time: 60
  restart-on-crash: true
  restart-script: ./start.sh
  moved-too-quickly-threshold: 100.0
  save-user-cache-on-stop-only: true
  moved-wrongly-threshold: 0.0625
  filter-creative-items: true
  baby-zombie-movement-speed: 0.5
  limit-player-interactions: true
commands:
  log: true
  tab-complete: 0
  spam-exclusions:
  - /skill
  replace-commands:
  - setblock
  - summon
  - testforblock
  - tellraw
  silent-commandblock-console: true
messages:
  restart: Server is restarting
  whitelist: You are not whitelisted.
  unknown-command: Unknown command.
  server-full: The server is full.
  outdated-client: Outdated client! Please use {0}
  outdated-server: Outdated server! I'm still on {0}
timings:
  enabled: false
  verbose: false
  server-name-privacy: false
  hidden-config-entries:
  - database
  - settings.bungeecord-addresses
  history-interval: 300
  history-length: 3600
stats:
  disable-saving: true
  forced-stats:
    achievement:
      openInventory: 1
world-settings:
  default:
    verbose: false
    enable-zombie-pigmen-portal-spawns: true
    wither-spawn-sound-radius: 0
    zombie-aggressive-towards-villager: true
    hanging-tick-frequency: 100
    view-distance: 8
    arrow-despawn-rate: 1200
    item-despawn-rate: 6000
    merge-radius:
      item: 2.5
      exp: 3.0
    dragon-death-sound-radius: 0
    seed-village: 10387312
    seed-feature: 14357617
    max-entity-collisions: 8
    entity-tracking-range:
      players: 48
      animals: 48
      monsters: 48
      misc: 32
      other: 64
    save-structure-info: true
    growth:
      cactus-modifier: 100
      cane-modifier: 100
      melon-modifier: 100
      mushroom-modifier: 100
      pumpkin-modifier: 100
      sapling-modifier: 100
      wheat-modifier: 100
      netherwart-modifier: 100
    max-bulk-chunks: 10
    nerf-spawner-mobs: false
    ticks-per:
      hopper-transfer: 8
      hopper-check: 8
    hopper-amount: 1
    entity-activation-range:
      animals: 32
      monsters: 32
      misc: 16
    random-light-updates: false
    mob-spawn-range: 4
    anti-xray:
      enabled: true
      engine-mode: 1
      hide-blocks:
      - 14
      - 15
      - 16
      - 21
      - 48
      - 49
      - 54
      - 56
      - 73
      - 74
      - 82
      - 129
      - 130
      replace-blocks:
      - 1
      - 5
    max-tnt-per-tick: 100
    hunger:
      walk-exhaustion: 0.2
      sprint-exhaustion: 0.8
      combat-exhaustion: 0.3
      regen-exhaustion: 3.0
    max-tick-time:
      tile: 50
      entity: 50
    chunks-per-tick: 650
    clear-tick-list: false
    cache-chunk-maps: true
    use-async-lighting: true
    tnt-entity-height-nerf: 0
    disable-explosion-knockback: false
    all-chunks-are-slime-chunks: false
    allow-undead-horse-leashing: false
    water-over-lava-flow-speed: 5
    generator-settings:
      canyon: false
      caves: false
      dungeon: false
      fortress: false
      mineshaft: false
      monument: false
      stronghold: false
      temple: false
      village: false
      flat-bedrock: true
    allow-block-location-tab-completion: true
    load-chunks:
      enderpearls: false
      tnt-entities: false
      falling-blocks: false
    fishing-time-range:
      MinimumTicks: 100
      MaximumTicks: 900
    despawn-ranges:
      soft: 28
      hard: 96
    game-mechanics:
      boats-drop-boats: false
      disable-player-crits: false
      disable-chest-cat-detection: true
      disable-end-credits: true
    squid-spawn-height:
      minimum: 45.0
      maximum: 63.0
    player-exhaustion:
      block-break: 0.02500000037252903
      swimming: 0.014999999664723873
    remove-unloaded:
      enderpearls: true
      tnt-entities: true
      falling-blocks: true
    fast-drain:
      lava: true
      water: true
    lava-flow-speed:
      normal: 30
      nether: 10
    use-hopper-check: false
    fix-cannons: false
    remove-invalid-mob-spawner-tile-entities: true
    container-update-tick-rate: 2
    keep-spawn-loaded: false
    falling-blocks-collide-with-signs: false
    disable-mood-sounds: true
    disable-ice-and-snow: true
    portal-search-radius: 64
    disable-teleportation-suffocation-check: true
    player-blocking-damage-multiplier: 0.5
    optimize-explosions: true
    max-growth-height:
      cactus: 3
      reeds: 3
    falling-block-height-nerf: 0
    mob-spawner-tick-rate: 2
    tnt-explosion-volume: 4.0
    nether-ceiling-void-damage: false
    disable-thunder: true
    tick-next-tick-list-cap: 5000
    tick-next-tick-list-cap-ignores-redstone: true
effect-modifiers:
  strength: 1.3
  weakness: -0.5
stackable-buckets:
  lava: false
  water: false
  milk: false
warnWhenSettingExcessiveVelocity: false
data-value-allowed-items: []
